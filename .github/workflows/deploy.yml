
name: Deploy Lovable website to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build website
        run: bun run build

      - name: Inspect build output
        run: |
          echo "=== Repository root ==="
          ls -la
          echo "=== Likely output directories ==="
          find . -maxdepth 5 -type d \
            \( -name dist -o -name .output -o -name build -o -name public \) \
            -not -path './node_modules/*'
          echo "=== Generated HTML files ==="
          find . -maxdepth 6 -type f -name '*.html' \
            -not -path './node_modules/*' | head -100

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy website
        uses: actions/deploy-pages@v4
